<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recolocação — Sistema de Vida</title>
<meta name="color-scheme" content="dark"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230d1b2a%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 dominant-baseline=%27central%27 text-anchor=%27middle%27 font-size=%2720%27 fill=%27%23c9a84c%27%3E%E2%97%AC%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0d1b2a">

</head>
<body>
<style>
:root{--bg:#0d1b2a;--fg:#e8edf3;--muted:#8ba0b8;--accent:#c9a84c;--on-accent:#0d1b2a;--bar:#1b2e42;--line:rgba(201,168,76,.22);--btn:#223650;--btn-fg:#e8edf3;--btn-line:rgba(201,168,76,.28);--danger:#ff9a8f;--sel:#c9a84c;--ok:#86efac;--warn:#e8c97a;--ui:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color-scheme:dark;}
:root{
  
  
  --paper:#ffffff;--ink:#0f1722;--ink-soft:#4a5565;--rule-soft:#c8cfdb;--card:#f4f7fc;--chip:#e3ebfb;--edge:#dbe3f0;--ph:#9aa4b5;
  
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui);margin:0;
  padding-block:12px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
[hidden]{display:none!important}

.app{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sp{flex:1 1 8px}
.btn{font:600 13px var(--ui);min-height:36px;padding:0 12px;border-radius:7px;border:1px solid var(--btn-line);background:var(--btn);color:var(--btn-fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:32px;padding:0 10px}
.btn.sq{min-width:36px;padding:0}
.btn.bold{font-weight:900;min-width:34px;padding:0}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.crumb:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;min-height:36px}
.zoom{display:inline-flex;gap:4px}
.status{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 16px}
.status .ok{color:var(--ok)}.status .warn{color:var(--warn)}.status .bad{color:var(--danger)}
details.aud summary{cursor:pointer;font-size:13px;font-weight:600;padding:4px 0}
.audbody{display:flex;flex-direction:column;gap:10px;padding-top:6px;font-size:13px}
.audbody label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12.5px}
.audbody textarea,.audbody input[type=text]{font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--btn-line);border-radius:6px;background:var(--btn);color:var(--fg);padding:6px 8px;width:100%}
.log{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.log .ok{color:var(--ok)}.log .bad{color:var(--danger)}
.note{color:var(--muted);font-size:12.5px;margin:0}

.ctxwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.crumbs,.acts,.menu{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.crumbs,.acts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.crumbs::-webkit-scrollbar,.acts::-webkit-scrollbar{display:none}
.crumbs>*,.acts>*{flex:none}
.menu{flex-wrap:wrap}
span.sm{display:none}
.crumb{font:600 12.5px var(--ui);border:1px solid var(--btn-line);background:var(--btn);color:var(--btn-fg);border-radius:99px;padding:3px 10px;cursor:pointer;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.menu{border-top:1px dashed var(--line);padding-top:6px}

.stage{overflow-x:auto;padding:2px 0 10px}
.wrap{position:relative;margin:0 auto}

/* ===== Folha A4: 794 x 1123 px, desenhada sempre neste tamanho e só ampliada/reduzida na tela ===== */
.sheet{--a:#1f5fd6;position:absolute;left:0;top:0;width:794px;height:1123px;transform-origin:0 0;background:var(--paper);color:var(--ink);
  padding:45px;overflow:hidden;font-family:"CVF","Roboto","Helvetica Neue",Arial,sans-serif;font-size:calc(var(--fs,12) * 1px);line-height:1.3;
  font-synthesis:none;font-kerning:normal;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:0 1px 3px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.18)}
.sheet.bw{--a:#000000;--chip:#e7e7e7;--card:#f2f2f2;--edge:#bdbdbd}
.sheet *{margin:0;padding:0;box-sizing:border-box}
.page{display:flex;flex-direction:column;gap:.95em;height:auto}
.page>*{flex:none}
.page.flush{justify-content:space-between}
.hd{padding-bottom:.7em;border-bottom:.2em solid var(--a)}
.name{font-size:2.22em;font-weight:700;line-height:1.1;letter-spacing:.01em}
.role{color:var(--a);font-size:1.2em;font-weight:700;letter-spacing:.055em;margin-top:.28em}
.contact{display:flex;flex-wrap:wrap;margin-top:.6em;color:var(--ink-soft);font-size:.96em}
.citem{display:inline-flex;align-items:baseline}
.sep{margin:0 .7em}
.citem[data-first] .sep{display:none}
.sec-h{font-size:1.09em;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a);padding-bottom:.3em;margin-bottom:.55em;border-bottom:.065em solid var(--rule-soft)}
.para{font-size:1.02em;line-height:1.3;text-align:justify}
.jobs{display:flex;flex-direction:column;gap:.78em}
.job-h{display:flex;justify-content:space-between;align-items:baseline;gap:.8em}
.job-l{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .35em;min-width:0}
.job-l[data-nobar] .bar{display:none}
.t{font-size:1.07em;font-weight:700}
.bar,.co{color:var(--a);font-size:1.13em;font-weight:700}
.d{color:var(--ink-soft);font-size:.95em;font-weight:700;white-space:nowrap;flex:none;text-align:right}
.bullets{display:flex;flex-direction:column;gap:.22em;margin-top:.32em}
.li{display:flex;align-items:flex-start;gap:.55em}
.bul{flex:none;width:.34em;height:.34em;margin-top:.6em;border-radius:50%;background:var(--a)}
.li-t{flex:1;min-width:0;font-size:1em;line-height:1.3}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:.55em}
.card{background:var(--card);border-left:.28em solid var(--a);padding:.55em .7em .55em .8em;min-width:0}
.card-t{font-size:1.02em;font-weight:700}
.card-d{font-size:.96em;color:var(--ink-soft);margin-top:.14em;line-height:1.28}
.edu-row{display:grid;grid-template-columns:1.75fr 1fr;gap:.7em}
.edu-box{border:.075em solid var(--edge);padding:.6em .75em;min-width:0}
.entries{display:flex;flex-direction:column;gap:.5em}
.edu-t{font-size:1.04em;font-weight:700}
.edu-s{font-size:.96em;color:var(--ink-soft);margin-top:.12em}
.edu-lbl{font-size:1.02em;font-weight:700;margin-bottom:.4em}
.chips{display:flex;flex-wrap:wrap;gap:.4em}
.chip{background:var(--chip);color:var(--a);font-size:.95em;font-weight:700;border-radius:999px;padding:.14em .85em}
.ed{outline:none;overflow-wrap:break-word}
.sheet:not(.editing) [data-empty="1"]{display:none!important}

/* Só aparece ao editar; o PDF e a visualização não incluem nada disto */
.sheet.editing .ed{cursor:text;min-width:1.6em}
.sheet.editing .ed:hover{background:rgba(31,95,214,.07)}
.sheet.editing .ed:focus{background:rgba(31,95,214,.11);box-shadow:0 0 0 1px #1f5fd6}
.sheet.editing .ed:empty::before{content:attr(data-ph);color:var(--ph);font-weight:400;font-style:italic}
.sheet.editing .sel{outline:2px dashed #1f5fd6;outline-offset:3px}
.sheet.editing .sec-h:empty,.sheet.editing .chip:empty{min-width:6em}

.xhost{position:fixed;left:-20000px;top:0;width:794px;height:1123px;pointer-events:none}

@media (max-width:560px){
  .top{padding:6px 8px;gap:6px}.row{gap:6px}
  .btn{font-size:12.5px;min-height:34px;padding:0 9px}.btn.sm{min-height:30px;padding:0 8px}
  span.lg{display:none}span.sm{display:inline}
  .status{font-size:11.5px;gap:0 12px}.status .z{display:none}
  .chk{font-size:12.5px}}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  body::before,.top,.ctxwrap{display:none!important}
  .app{display:block;max-width:none;margin:0}
  .stage{overflow:visible;padding:0}
  .wrap{width:auto!important;height:auto!important;margin:0}
  .sheet{position:static;transform:none!important;box-shadow:none;width:794px;height:1122px;margin:0}
}

/* ===== Central de currículos: layout com histórico ===== */
.shell{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
.main{display:flex;flex-direction:column;gap:10px;min-width:0;max-width:1000px;width:100%}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.side .sh{display:flex;align-items:baseline;gap:6px;font-size:15px}
.side .cnt{color:var(--muted);font-size:13px}
.side input[type=search],.side select,.recbar input[type=text],.recbar select,.mbox input[type=text],.mbox textarea{font:13.5px var(--ui);border:1px solid var(--btn-line);border-radius:7px;background:var(--btn);color:var(--fg);padding:7px 9px;width:100%;min-height:36px}
.mbox textarea{font:12.5px/1.35 ui-monospace,Menlo,Consolas,monospace;min-height:180px}
.side input:focus-visible,.side select:focus-visible,.recbar input:focus-visible,.recbar select:focus-visible,.mbox input:focus-visible,.mbox textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.hlist{display:flex;flex-direction:column;gap:6px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:8px 10px;border:1px solid var(--line);border-left:4px solid transparent;border-radius:8px;background:var(--btn);min-width:0}
.item:hover{border-color:var(--accent)}
.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.item.cur{border-left-color:var(--accent);background:var(--btn);border-color:var(--accent)}
.item .i-t{font:700 13.5px var(--ui);color:var(--fg);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .i-s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .i-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;border-radius:99px;padding:1px 8px;font-weight:700;font-size:11px;background:var(--line);color:var(--fg)}
.tag.st-enviado{background:#d8e8ff;color:#0b3f94}.tag.st-entrevista{background:#d7f3e1;color:#0d5a2d}.tag.st-sem-retorno{background:#ffe9c9;color:#7a4700}.tag.st-encerrado{background:#e7e7ea;color:#444}
.cl.ok{color:var(--ok)}.cl.warn{color:var(--warn)}.cl.bad{color:var(--danger)}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:9px 11px;background:var(--bar);border:1px solid var(--line);border-top:3px solid var(--kc,var(--line));border-radius:10px;min-width:0}
.kpi:hover{border-color:var(--accent)}
.kpi:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kpi[aria-pressed="true"]{background:var(--btn);border-color:var(--accent);border-top-color:var(--kc,var(--accent))}
.kpi .k-n{font:700 26px/1.1 var(--ui);color:var(--fg);font-variant-numeric:tabular-nums}
.kpi .k-l{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.k-total{--kc:var(--accent)}.kpi.k-novo{--kc:#8ba0b8}.kpi.k-enviado{--kc:#6aa7ff}.kpi.k-entrevista{--kc:#5fd08a}.kpi.k-sem{--kc:#e8b04c}.kpi.k-enc{--kc:#9a9aa6}
.kpisum{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 16px;margin:0}
.kpisum b{color:var(--fg)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi .k-n{font-size:22px}}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.recbar{background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.recbar summary{cursor:pointer;font-size:13px;font-weight:700;padding:2px 0}
.rgrid{display:grid;grid-template-columns:1.3fr 1.3fr;gap:8px;padding-top:6px}
.rgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.rgrid .span2{grid-column:1/-1}
.vrow{display:flex;gap:6px}
.vrow input{flex:1}
.empty{background:var(--bar);border:1px dashed var(--btn-line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty h2{margin:0 0 6px;color:var(--fg);font-size:18px}
.empty .row{justify-content:center;margin-top:12px}

.modal{position:fixed;inset:0;z-index:60;background:rgba(10,16,26,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 50px rgba(0,0,0,.35);max-height:92vh;overflow:auto}
.mbox h2{margin:0;font-size:17px}
.mbox .jt{font-weight:700}
.mbox .err{color:var(--danger);font-size:13px;margin:0}
.mbox .row{justify-content:flex-end}
#bHist{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;max-height:none;display:none}
  body.hist-open .side{display:flex}
  .side .hlist{max-height:48vh;overflow:auto}
  #bHist{display:inline-flex}
  .rgrid{grid-template-columns:1fr}
}
@media print{.kpis,.side,.recbar,.empty,.modal{display:none!important}.shell{display:block;max-width:none}.main{max-width:none}}

</style>

<div class="shell">
  <aside class="side" id="side" aria-label="Histórico de currículos">
    <div class="sh"><a class="btn sm" href="../index.html" style="text-decoration:none">← Hub</a><strong>Recolocação</strong><span class="cnt" id="hCnt"></span></div>
    <div class="row">
      <button class="btn primary" id="bLoad" type="button">Carregar JSON</button>
      <button class="btn" id="bPaste" type="button">Colar JSON</button>
    </div>
    <input type="file" id="fFile" accept=".json,application/json" multiple hidden>
    <input type="search" id="hQ" placeholder="Buscar por título, vaga ou nota" aria-label="Buscar currículos">
    <select id="hSt" aria-label="Filtrar por situação"></select>
    <div class="hlist" id="hList"></div>
    <div class="row"><button class="btn sm" id="bExpAll" type="button" title="Baixa um arquivo com todos os currículos, como cópia de segurança">Exportar tudo (.json)</button></div>
  </aside>

  <div class="main">
    <section class="kpis" id="kpis" aria-label="Indicadores das candidaturas"></section>
    <div class="top">
      <div class="row">
        <button class="btn" id="bHist" type="button" aria-expanded="false">Histórico</button>
        <button class="btn" id="bEdit" type="button">Editar</button>
        <button class="btn primary" id="bPdf" type="button" title="Gera o PDF em A4, na vertical"><span class="lg">Baixar PDF (A4)</span><span class="sm">Baixar PDF</span></button>
        <button class="btn" id="bBw" type="button" aria-pressed="false"><span class="lg">Preto e branco</span><span class="sm">P&amp;B</span></button>
        <label class="chk"><input type="checkbox" id="cFill" checked><span class="lg">Preencher a folha</span><span class="sm">Preencher</span></label>
        <span class="sp"></span>
        <button class="btn" id="bUndo" type="button">Desfazer</button>
        <button class="btn" id="bRedo" type="button">Refazer</button>
        <span class="zoom"><button class="btn sq" id="zOut" type="button" aria-label="Diminuir zoom">−</button><button class="btn" id="zFit" type="button" title="Ajustar à largura da tela">Ajustar</button><button class="btn" id="z100" type="button" title="Tamanho real da folha">100%</button><button class="btn sq" id="zIn" type="button" aria-label="Aumentar zoom">+</button></span>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <details class="aud" id="aud">
        <summary>Firebase: login, salvamento e auditoria</summary>
        <div class="audbody">
          <p class="note" id="fbNote"></p>
          <div class="row">
            <button class="btn primary" id="fbIn" type="button">Entrar no Sistema de Vida</button>
            <button class="btn" id="fbOut" type="button">Sair</button>
            <button class="btn" id="fbSync" type="button">Sincronizar agora</button>
            <button class="btn" id="fbAudit" type="button">Auditar tudo</button>
          </div>
          <label>Configuração do Firebase (use este campo se ela não estiver gravada no arquivo; fica guardada só neste navegador)
            <textarea id="fbCfg" rows="5" spellcheck="false" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", appId: "..." }'></textarea>
          </label>
          <div class="row">
            <button class="btn" id="fbSave" type="button">Guardar configuração</button>
            <button class="btn" id="fbClear" type="button">Remover configuração</button>
          </div>
          <ol class="log" id="fbLog"></ol>
        </div>
      </details>
    </div>

    <details class="recbar" id="recbar" open>
      <summary>Dados da candidatura</summary>
      <div class="rgrid">
        <label class="span2">Título do currículo
          <input type="text" id="rTitle" spellcheck="false" placeholder="Ex.: Zanchetta – Auxiliar Administrativo (Faturamento)"></label>
        <label>Link da vaga ou e-mail
          <span class="vrow"><input type="text" id="rVaga" spellcheck="false" placeholder="https://… ou nome@empresa.com.br"><button class="btn sm" id="rVagaGo" type="button">Abrir</button></span></label>
        <label>Situação
          <select id="rStatus"></select></label>
        <label class="span2">Observação
          <input type="text" id="rNota" spellcheck="false" placeholder="Ex.: contato por WhatsApp (15) 98105-6431"></label>
        <div class="row span2">
          <button class="btn sm" id="rDup" type="button">Duplicar</button>
          <button class="btn sm" id="rExp" type="button">Exportar JSON</button>
          <button class="btn sm danger" id="rReset" type="button">Restaurar original</button>
          <button class="btn sm danger" id="rDel" type="button">Excluir</button>
        </div>
      </div>
    </details>

    <div class="ctxwrap" id="ctxwrap" hidden>
      <div class="crumbs" id="crumbs"></div>
      <div class="acts" id="acts"></div>
      <div class="menu" id="menu" hidden></div>
    </div>

    <div class="empty" id="empty" hidden>
      <h2>Nenhum currículo ainda</h2>
      <p>Carregue o arquivo JSON que o Claude gerou para a vaga. A página pergunta o link da vaga ou o e-mail e guarda tudo no histórico.</p>
      <div class="row"><button class="btn primary" id="bLoad2" type="button">Carregar JSON</button><button class="btn" id="bPaste2" type="button">Colar JSON</button></div>
    </div>

    <div class="stage" id="stage"><div class="wrap" id="wrap"><div class="sheet" id="sheet"><div class="page" id="page"></div></div></div></div>
  </div>
</div>

<div class="modal" id="mdl" hidden role="dialog" aria-modal="true" aria-labelledby="mdlT">
  <div class="mbox">
    <h2 id="mdlT"></h2>

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function frag(html){
  var d=new DOMParser().parseFromString('<!doctype html><body>'+html,'text/html'),out=document.createDocumentFragment();
  (function walk(n,dst){Array.prototype.forEach.call(n.childNodes,function(c){
    if(c.nodeType===3)dst.appendChild(document.createTextNode(c.data));
    else if(c.nodeType===1){var t=c.tagName;
      if(t==='B'||t==='STRONG'){var b=document.createElement('b');walk(c,b);dst.appendChild(b)}
      else if(t==='BR')dst.appendChild(document.createElement('br'));
      else walk(c,dst)}})})(d.body,out);
  return out}
function inlineHtml(el){
  var s='';

    if(c.nodeType===3)s+=esc(c.data.replace(/ /g,' '));
    else if(c.nodeType===1){var t=c.tagName;
      if(t==='B'||t==='STRONG'){s+='<b>';walk(c);s+='</b>'}
      else if(t==='BR')s+='<br>';
      else if(t==='DIV'||t==='P'){if(s&&!/<br>$/.test(s))s+='<br>';walk(c)}

  return s.replace(/(<br>)+$/,'').replace(/<b><\/b>/g,'')}

/* ---------- Vaga: link ou e-mail ---------- */
function classify(v){
  v=String(v||'').trim();if(!v)return {kind:'',value:''};
  if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return {kind:'email',value:v};
  if(/^https?:\/\/[^\s/]+\.[^\s/]+\S*$/i.test(v))return {kind:'link',value:v};
  if(/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(v))return {kind:'link',value:'https://'+v};
  return {kind:'texto',value:v}}
function openVaga(v){
  if(!v||!v.value)return;
  if(v.kind==='email')window.location.href='mailto:'+v.value;
  else if(v.kind==='link')window.open(v.value,'_blank','noopener')}

/* ---------- Edição: histórico (desfazer) e gravação no registro atual ---------- */
var debCommit=debounce(function(){commit()},500);
function touch(r){r.updatedAt=nextStamp(r.updatedAt);saveStore();queueSave(r.id);renderHist();renderUI()}
function commit(){
  var r=cur();if(!r)return false;
  var j=JSON.stringify(readModel());if(j===hist.last)return false;
  if(hist.last){hist.u.push(hist.last);if(hist.u.length>60)hist.u.shift()}
  hist.r=[];hist.last=j;r.model=JSON.parse(j);touch(r);return true}
function restore(j){var r=cur();build(JSON.parse(j));setTarget(null);fit();r.model=JSON.parse(j);touch(r)}
function undo(){commit();if(!hist.u.length)return;hist.r.push(hist.last);hist.last=hist.u.pop();restore(hist.last)}
function redo(){if(!hist.r.length)return;hist.u.push(hist.last);hist.last=hist.r.pop();restore(hist.last)}

function addRecord(it){
  var now=Date.now(),r={id:newId(),title:it.title,vaga:it.vaga||{kind:'',value:''},status:it.status||'Novo',nota:it.nota||'',
    createdAt:it.createdAt||now,updatedAt:now,model:it.model,orig:JSON.stringify(it.model)};

function removeRecord(id){

  if(next)select(next.id);else{store.currentId=null;saveStore();renderAll()}}

/* ---------- Leitura de JSON (arquivo, arrastar ou colar) ---------- */
function normItem(o){
  if(!o||typeof o!=='object')return null;
  var m=o.model;
  if(typeof m==='string'){try{m=JSON.parse(m)}catch(e){m=null}}
  if(!m&&o.header&&o.sections)m=o;
  if(!m||typeof m!=='object'||!valid(m))return null;
  var v=o.vaga,vv=typeof v==='string'?v:(v&&(v.valor||v.value)||'');
  var st=STATUS.indexOf(o.status)>=0?o.status:'Novo';
  return {title:String(o.titulo||o.title||plain(m.header&&m.header.role)||plain(m.header&&m.header.name)||'Currículo').slice(0,160),
    vaga:classify(vv),status:st,nota:String(o.nota||'').slice(0,400),createdAt:Date.parse(o.criadoEm||o.createdAt)||Date.now(),model:m}}
function extractItems(data){
  if(Array.isArray(data))return data;
  if(data&&Array.isArray(data.curriculos))return data.curriculos;
  return [data]}
function sameItem(it){
  var j=JSON.stringify(it.model);
  return store.records.some(function(r){return r.title===it.title&&JSON.stringify(r.model)===j})}

function modal(title,body,actions,onKey){

  m._key=key;document.addEventListener('keydown',key);
  var f=$('input,textarea',b)||$('button',a);if(f)f.focus();
  m._close=function(){m.hidden=true;document.removeEventListener('keydown',key);if(prev&&prev.focus)try{prev.focus()}catch(e){}};

function askVaga(it,i,n){
  return new Promise(function(res){
    var box=el('div','');
    var t=el('p','jt',it.title);
    var lab=el('label','');lab.style.cssText='display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)';

    lab.append(inp);box.append(t,lab);
    function save(){
      var c=classify(inp.value);
      if(!c.kind){modalErr('Informe o link da vaga ou o e-mail, ou use "Pular".');inp.focus();return}
      if(c.kind==='texto'){modalErr('Isso não parece um link nem um e-mail. Exemplos: https://site.com/vaga ou rh@empresa.com.br');inp.focus();return}
      closeModal();res({a:'save',v:c})}
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();save()}});
    modal('Vaga do currículo'+(n>1?' ('+i+' de '+n+')':''),box,[
      {label:'Cancelar tudo',cls:'danger',fn:function(){closeModal();res({a:'cancel'})},esc:true},
      {label:'Pular',fn:function(){closeModal();res({a:'skip'})}},
      {label:'Salvar',cls:'primary',fn:save}])})}

function importText(txt){
  var data;
  try{data=JSON.parse(txt)}catch(e){return Promise.reject(new Error('O conteúdo não é um JSON válido ('+e.message+').'))}
  var raw=extractItems(data),items=[],bad=0;
  raw.forEach(function(o){var it=normItem(o);if(it)items.push(it);else bad++});
  if(!items.length)return Promise.reject(new Error('Nenhum currículo reconhecido nesse JSON.'));
  var added=[],dups=0,skipped=0,seq=Promise.resolve(),cancelled=false;
  var fresh=items.filter(function(it){if(sameItem(it)){dups++;return false}return true});
  fresh.forEach(function(it,i){
    seq=seq.then(function(){
      if(cancelled)return;
      return askVaga(it,i+1,fresh.length).then(function(r){
        if(r.a==='cancel'){cancelled=true;return}
        if(r.a==='save')it.vaga=r.v;else{it.vaga={kind:'',value:''};skipped++}
        added.push(addRecord(it))})})});
  return seq.then(function(){
    if(added.length)select(added[added.length-1].id);
    var parts=[];
    if(added.length)parts.push(added.length+(added.length>1?' currículos adicionados':' currículo adicionado'));
    if(dups)parts.push(dups+' já existia'+(dups>1?'m':''));
    if(bad)parts.push(bad+' ignorado'+(bad>1?'s':'')+' por formato inválido');
    if(cancelled)parts.push('importação cancelada');
    msg(parts.join(' · ')||'Nada foi adicionado.');
    renderAll();return added.length})}
function importFiles(files){
  var list=Array.prototype.slice.call(files||[]);if(!list.length)return;
  var seq=Promise.resolve();
  list.forEach(function(f){
    seq=seq.then(function(){return f.text()}).then(importText).catch(function(e){msg(f.name+': '+e.message)})});
  return seq}
function openPaste(){
  var ta=el('textarea','');ta.id='mdlTxt';ta.spellcheck=false;ta.placeholder='Cole aqui o JSON gerado pelo Claude';
  modal('Colar JSON',ta,[

      var t=ta.value.trim();if(!t){modalErr('Cole o JSON antes de carregar.');return}
      try{JSON.parse(t)}catch(e){modalErr('JSON inválido: '+e.message);return}
      closeModal();importText(t).catch(function(e){msg(e.message)})}}])}

/* ---------- Firebase: login Google + Realtime Database com auditoria por leitura de volta ---------- */
var cloud={cfg:null,state:'off',user:null,db:null,col:null,log:[],st:{},q:{},timer:null,running:false,err:'',at:null,bound:false};
function inArtifact(){return typeof (window.claude&&window.claude.use)==='function'}
function readFbCfg(){try{var o=JSON.parse(localStorage.getItem(LS_FB)||'null');return o&&o.cfg?o.cfg:null}catch(e){return null}}
function cfgNow(){return (FB_CONFIG&&FB_CONFIG.apiKey&&FB_CONFIG.projectId)?FB_CONFIG:readFbCfg()}
function cfgFromFile(){return !!(FB_CONFIG&&FB_CONFIG.apiKey&&FB_CONFIG.projectId)}
function parseCfg(txt){
  var s=String(txt).trim().replace(/^[^{]*/,'').replace(/[^}]*$/,'').replace(/\/\/.*$/gm,'');
  s=s.replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
  var o=JSON.parse(s);if(!o.apiKey||!o.projectId)throw new Error('faltam apiKey e projectId');return o}
function clog(ok,m){cloud.log.unshift({t:new Date(),ok:ok,msg:m});cloud.log.length=Math.min(cloud.log.length,14);renderLog()}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('não foi possível carregar '+src))};document.head.appendChild(s)})}
function errTxt(e){return (e&&(e.code||''))+' '+((e&&e.message)||e)}
function signedIn(){return cloud.state!=='off'&&cloud.state!=='signedout'&&cloud.state!=='connecting'&&cloud.state!=='blocked'&&cloud.state!=='setup'&&!!cloud.col}

function cloudInit(){
  cloud.cfg=cfgNow();
  if(!cloud.cfg){cloud.state='off';renderStatus();renderLog();return Promise.resolve()}
  if(inArtifact()){cloud.state='off';renderStatus();renderLog();return Promise.resolve()}
  cloud.state='connecting';renderStatus();renderLog();
  var p=window.firebase?Promise.resolve():loadScript(FB_APP_URL).then(function(){return loadScript(FB_AUTH_URL)}).then(function(){return loadScript(FB_DB_URL)});
  return p.then(function(){
    if(!(firebase.apps&&firebase.apps.length))firebase.initializeApp(cloud.cfg);
    if(!cloud.cfg.databaseURL)throw new Error('falta databaseURL na configuração do Firebase');
    cloud.db=firebase.database();
    if(!cloud.bound){cloud.bound=true;
      firebase.auth().onAuthStateChanged(onUser,function(e){cloud.state='error';cloud.err=errTxt(e);clog(false,'Falha no login: '+cloud.err);renderStatus()})}
  }).catch(function(e){cloud.state='blocked';cloud.err=errTxt(e);clog(false,'Falha ao conectar: '+cloud.err);renderStatus()})}
function onUser(u){
  if(!u){cloud.user=null;cloud.col=null;cloud.state='signedout';renderStatus();renderLog();renderHist();return}
  cloud.user=u;cloud.col=cloud.db.ref('users/'+u.uid+'/modulos/'+FB_COLL);
  clog(true,'Login feito ('+(u.email||u.uid)+')');
  cloudSync()}
function cloudSignIn(){
  if(!window.firebase||!cloud.cfg){clog(false,'Login indisponível: configure o Firebase primeiro');return}

      var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},5000);msg('PDF gerado ('+Math.round(blob.size/1024)+' KB).')})})
   .catch(function(e){msg(e&&e.code==='declined'?'Download cancelado.':(e&&e.code==='over'?e.message:'Não foi possível gerar o PDF: '+(e&&e.message||e)))})
   .then(function(){state.busy=false;$('#bPdf').disabled=false})}

/* ---------- Ligações da página ---------- */
$('#bEdit').addEventListener('click',function(){setEdit(!state.edit)});
$('#bPdf').addEventListener('click',exportPdf);
$('#bBw').addEventListener('click',function(){state.bw=!state.bw;sheet.classList.toggle('bw',state.bw);commit();renderUI()});
$('#cFill').addEventListener('change',function(e){state.autofit=e.target.checked;savePrefs();fit();renderUI()});
$('#bUndo').addEventListener('click',undo);$('#bRedo').addEventListener('click',redo);
$('#zIn').addEventListener('click',function(){setZoom(Math.min(2.2,state.kEff*1.15))});
$('#zOut').addEventListener('click',function(){setZoom(Math.max(.3,state.kEff/1.15))});
$('#zFit').addEventListener('click',function(){setZoom(null)});
$('#z100').addEventListener('click',function(){setZoom(1)});

/* histórico e JSON */
$('#hSt').append(el('option','','Todas as situações'));$('#hSt').firstChild.value='';
STATUS.forEach(function(s){var o=el('option','',s);o.value=s;$('#hSt').append(o);var o2=el('option','',s);o2.value=s;$('#rStatus').append(o2)});
$('#hQ').addEventListener('input',function(e){flt.q=e.target.value;renderHist()});
$('#hSt').addEventListener('change',function(e){flt.st=e.target.value;renderHist()});
['bLoad','bLoad2'].forEach(function(id){$('#'+id).addEventListener('click',function(){$('#fFile').value='';$('#fFile').click()})});
['bPaste','bPaste2'].forEach(function(id){$('#'+id).addEventListener('click',openPaste)});
$('#fFile').addEventListener('change',function(e){importFiles(e.target.files)});
$('#bExpAll').addEventListener('click',exportAll);
$('#bHist').addEventListener('click',function(){var o=document.body.classList.toggle('hist-open');$('#bHist').setAttribute('aria-expanded',String(o))});
['dragenter','dragover'].forEach(function(ev){document.addEventListener(ev,function(e){if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>=0)e.preventDefault()})});
document.addEventListener('drop',function(e){
  if(!(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length))return;
  e.preventDefault();importFiles(e.dataTransfer.files)});

/* dados da candidatura */
function onRec(id,fn){$(id).addEventListener('input',function(e){var r=cur();if(!r)return;fn(r,e.target.value);touch(r);renderRec()})}
onRec('#rTitle',function(r,v){r.title=v.slice(0,160)||'Currículo'});
onRec('#rNota',function(r,v){r.nota=v.slice(0,400)});
$('#rStatus').addEventListener('change',function(e){var r=cur();if(!r)return;r.status=e.target.value;touch(r)});
$('#rVaga').addEventListener('input',function(e){var r=cur();if(!r)return;r.vaga=classify(e.target.value);r.vaga.value=e.target.value.trim()&&r.vaga.kind==='texto'?e.target.value.trim():r.vaga.value;touch(r);$('#rVagaGo').disabled=!(r.vaga.kind==='link'||r.vaga.kind==='email')});
$('#rVaga').addEventListener('blur',function(){renderRec()});
$('#rVagaGo').addEventListener('click',function(){var r=cur();if(r)openVaga(r.vaga)});
$('#rExp').addEventListener('click',exportOne);
$('#rDup').addEventListener('click',function(){
  var r=cur();if(!r)return;commit();
  var n=addRecord({title:r.title+' (cópia)',vaga:r.vaga,status:'Novo',nota:r.nota,model:JSON.parse(JSON.stringify(r.model))});select(n.id);msg('Currículo duplicado.')});
function twoClick(id,label,confirm,run){
  var t=null;$(id).addEventListener('click',function(){
    var b=$(id);
    if(!t){b.textContent=confirm;t=setTimeout(function(){t=null;b.textContent=label},4000);return}
    clearTimeout(t);t=null;b.textContent=label;run()})}
twoClick('#rReset','Restaurar original','Confirmar: apagar edições',function(){
  var r=cur();if(!r||!r.orig)return;
  build(JSON.parse(r.orig));setTarget(null);sheet.classList.toggle('bw',state.bw);fit();commit();msg('Versão original restaurada.')});
twoClick('#rDel','Excluir','Confirmar exclusão',function(){var r=cur();if(r)removeRecord(r.id)});

/* Firebase */
$('#fbIn').addEventListener('click',function(){if(AUTH_HOME){window.location.href=AUTH_HOME;return}cloudSignIn()});
$('#fbOut').addEventListener('click',cloudSignOut);
$('#fbSync').addEventListener('click',cloudSync);
$('#fbAudit').addEventListener('click',cloudAudit);
$('#fbSave').addEventListener('click',function(){
  try{var cfg=parseCfg($('#fbCfg').value);localStorage.setItem(LS_FB,JSON.stringify({cfg:cfg}));$('#fbCfg').value='';clog(true,'Configuração guardada neste navegador');cloudInit()}
  catch(e){clog(false,'Configuração inválida: '+e.message)}});
$('#fbClear').addEventListener('click',function(){
  try{localStorage.removeItem(LS_FB)}catch(e){}
  if(window.firebase&&firebase.auth&&cloud.user)firebase.auth().signOut();
  cloud.cfg=null;cloud.col=null;cloud.user=null;cloud.state='off';clog(true,'Configuração removida');renderStatus();renderLog();renderHist()});
window.addEventListener('resize',applyScale);
if(window.ResizeObserver)new ResizeObserver(applyScale).observe(stage);
window.addEventListener('beforeunload',function(){try{commit()}catch(e){}});

/* ---------- Início ---------- */
function boot(){
  loadPrefs();loadStore();
  var r=cur();
  if(r){build(r.model);hist.last=JSON.stringify(readModel());sheet.classList.toggle('bw',state.bw)}
  renderRec();applyScale();if(r)fit();renderAll();
  cloudInit()}
Promise.all([document.fonts.load('400 12px CVF'),document.fonts.load('700 12px CVF')]).catch(function(){}).then(boot);
window.CVHub={state:state,hist:hist,cloud:cloud,store:store,setEdit:setEdit,setZoom:setZoom,fit:fit,readModel:readModel,exportPdf:exportPdf,commit:commit,undo:undo,redo:redo,importText:importText,select:select,flush:flush,sync:cloudSync,audit:cloudAudit};
window.CVEditor=window.CVHub;
})();
</script>

</body>
</html>
